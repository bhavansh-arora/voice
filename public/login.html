<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign in — Voice Agent</title>
<link rel="stylesheet" href="app.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 360px; margin: 0 16px; }
  .login-card h1 { text-align: center; }
</style>
</head>
<body>
  <div class="card login-card">
    <h1>Voice Agent</h1>
    <p class="subtitle" style="text-align:center">Enter the admin password to continue.</p>
    <form id="loginForm">
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" autofocus autocomplete="current-password" />
      </div>
      <button type="submit" style="width:100%; justify-content:center">Sign in</button>
    </form>
    <p id="error" class="error-text" style="display:none; margin-top:10px; text-align:center"></p>
  </div>

<script>
(() => {
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const password = document.getElementById("password").value;
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        errorEl.textContent = "Wrong password - try again.";
        errorEl.style.display = "";
        return;
      }
      const next = new URLSearchParams(location.search).get("next");
      location.href = next && next.startsWith("/") ? next : "/index.html";
    } catch {
      errorEl.textContent = "Couldn't reach the server - try again.";
      errorEl.style.display = "";
    }
  });
})();
</script>
</body>
</html>
